<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupérateur d'Activités</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .results {
            display: none;
        }

        .result-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-left: 3px solid #667eea;
        }

        .activite-list {
            display: grid;
            gap: 15px;
        }

        .activite-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .activite-card:hover {
            border-color: #667eea;
            background: #f5f7ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .activite-titre {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .activite-description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Activités</h1>
        <p class="subtitle">Récupère les activités commençant par la lettre A</p>

        <div class="button-container">
            <button class="btn-primary" id="fetchBtn">Charger les activités</button>
            <button class="btn-secondary" id="clearBtn">Effacer</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Chargement en cours...</p>
        </div>

        <div class="message" id="message"></div>

        <div class="results" id="results">
            <div class="result-info" id="resultInfo"></div>
            <div class="activite-list" id="activiteList"></div>
        </div>
    </div>

    <script>
        // À remplacer par ton URL de deployment Apps Script
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyUzxrBSvOPce4WKuXYu9E065lQ3eMOEV3tOo1pUoI5FpPzgnz31BYdUjFJrCwMwgoV/exec';

        const fetchBtn = document.getElementById('fetchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');
        const results = document.getElementById('results');
        const resultInfo = document.getElementById('resultInfo');
        const activiteList = document.getElementById('activiteList');

        // Event listeners
        fetchBtn.addEventListener('click', fetchActivites);
        clearBtn.addEventListener('click', clearResults);

        async function fetchActivites() {
            // Réinitialise les messages
            message.className = 'message';
            message.textContent = '';
            results.style.display = 'none';

            // Affiche le loader
            loading.style.display = 'block';
            fetchBtn.disabled = true;

            try {
                const response = await fetch(WEBAPP_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                } else {
                    showMessage(`Erreur: ${data.error}`, 'error');
                }

            } catch (error) {
                console.error('Erreur:', error);
                showMessage(
                    `Erreur lors du chargement: ${error.message}\n\nAssurez-toi que:\n1. L'URL webapp est correctement configurée\n2. Le deployment est actif\n3. Tu as les permissions d'accès au sheet`,
                    'error'
                );
            } finally {
                loading.style.display = 'none';
                fetchBtn.disabled = false;
            }
        }

        function displayResults(data) {
            resultInfo.textContent = `${data.count} activité(s) trouvée(s) commençant par 'A'`;

            if (data.activites.length === 0) {
                activiteList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>Aucune activité trouvée commençant par la lettre A</p>
                    </div>
                `;
            } else {
                activiteList.innerHTML = data.activites
                    .map(activite => `
                        <div class="activite-card">
                            <div class="activite-titre">🎯 ${escapeHtml(activite.titre)}</div>
                            <div class="activite-description">${escapeHtml(activite.description)}</div>
                        </div>
                    `)
                    .join('');
            }

            results.style.display = 'block';
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function clearResults() {
            message.className = 'message';
            message.textContent = '';
            results.style.display = 'none';
            activiteList.innerHTML = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
