<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche Activités - Google Sheets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        .content {
            padding: 30px;
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .stat {
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-unit {
            font-size: 0.7em;
            color: #999;
        }
        
        .results {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .activity {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .activity:hover {
            background: #e9ecef;
        }
        
        .activity-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 1em;
        }
        
        .activity-desc {
            color: #666;
            font-size: 0.85em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #c33;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #1976d2;
            text-align: center;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .stat {
                text-align: left;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }
            
            .stat-label {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Recherche d'Activités</h1>
            <p>Activités commençant par la lettre "A"</p>
        </div>
        
        <div class="content">
            <button onclick="rechercherActivites()" id="searchBtn">
                🔍 Rechercher les activités commençant par A
            </button>
            
            <div id="resultsArea">
                <div class="info">
                    💡 Cliquez sur le bouton pour lancer la recherche
                </div>
            </div>
        </div>
    </div>

    <script>
        // À remplacer par l'URL de votre Web App déployée
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUzxrBSvOPce4WKuXYu9E065lQ3eMOEV3tOo1pUoI5FpPzgnz31BYdUjFJrCwMwgoV/exec';
        
        async function rechercherActivites() {
            const btn = document.getElementById('searchBtn');
            const resultsArea = document.getElementById('resultsArea');
            
            // Désactiver le bouton et afficher le chargement
            btn.disabled = true;
            btn.textContent = '⏳ Recherche en cours...';
            
            resultsArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Récupération des données depuis Google Sheets...</p>
                </div>
            `;
            
            const startTime = performance.now();
            
            try {
                // Appel à la Web App
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                const endTime = performance.now();
                const totalTime = (endTime - startTime) / 1000;
                
                if (data.success) {
                    afficherResultats(data, totalTime);
                } else {
                    afficherErreur(data.error || 'Erreur inconnue');
                }
                
            } catch (error) {
                afficherErreur(`Impossible de contacter le serveur: ${error.message}<br>
                <small>Vérifiez que l'URL de la Web App est correcte et déployée</small>`);
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Rechercher les activités commençant par A';
            }
        }
        
        function afficherResultats(data, totalTime) {
            const resultsArea = document.getElementById('resultsArea');
            
            let html = `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">⏱️ Temps serveur</div>
                        <div class="stat-value">${data.executionTime.toFixed(3)}</div>
                        <div class="stat-unit">secondes</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">🌐 Temps total</div>
                        <div class="stat-value">${totalTime.toFixed(3)}</div>
                        <div class="stat-unit">secondes</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">📊 Résultats</div>
                        <div class="stat-value">${data.count}</div>
                        <div class="stat-unit">activités</div>
                    </div>
                </div>
                
                <div class="results">
            `;
            
            if (data.results.length === 0) {
                html += '<div class="info">📭 Aucune activité commençant par "A" trouvée</div>';
            } else {
                data.results.forEach(item => {
                    html += `
                        <div class="activity">
                            <div class="activity-name">📌 ${escapeHtml(item.activite)}</div>
                            <div class="activity-desc">${escapeHtml(item.description)}</div>
                        </div>
                    `;
                });
            }
            
            html += `
                </div>
                <div class="info">
                    ⚡ Comparaison: Exécutez python3 get_activities.py dans Cloud Shell pour comparer les performances
                </div>
            `;
            
            resultsArea.innerHTML = html;
        }
        
        function afficherErreur(message) {
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = `
                <div class="error">
                    ❌ Erreur: ${message}
                </div>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
